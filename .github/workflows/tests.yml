name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimal:
    # pip install metric-diff with no extras: scikit-learn only. Everything must import and run;
    # tests that need the other libraries skip themselves.
    name: minimal / ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install . pytest
      - run: pytest -q
      - run: metric-diff matrix --case reg- --case bin-f1

  full:
    # Every supported library. torch is installed from the CPU-only index to keep CI fast.
    name: full / ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    env:
      KERAS_BACKEND: torch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install CPU-only torch
        if: runner.os != 'macOS'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[all]" pytest
      - run: pytest -q -o addopts="" -rs
      - name: Conformance matrix
        run: metric-diff matrix --format markdown --output matrix.md
      - uses: actions/upload-artifact@v4
        with:
          name: matrix-${{ matrix.os }}-py${{ matrix.python }}
          path: matrix.md
