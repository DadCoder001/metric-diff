[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "metric-diff"
version = "0.1.0.dev0"
description = "Find out why sklearn, torchmetrics and torcheval disagree on the same metric, and how to fix it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "metric-diff contributors" }]
keywords = ["metrics", "machine-learning", "debugging", "scikit-learn", "torchmetrics", "torcheval"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Debuggers",
]
dependencies = ["numpy>=1.23", "scikit-learn>=1.3"]

[project.optional-dependencies]
torch = ["torch>=2.0", "torchmetrics>=1.0", "torcheval>=0.0.7"]
keras = ["keras>=3.0"]
evaluate = ["evaluate>=0.4", "pillow"]
monai = ["monai>=1.3", "torch>=2.0"]
all = ["metric-diff[torch,keras,evaluate,monai]"]
dev = ["pytest>=7", "metric-diff[all]"]

[project.scripts]
metric-diff = "metric_diff.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/metric_diff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning", "ignore::FutureWarning"]
